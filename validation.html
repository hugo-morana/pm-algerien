<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dar ed-Darja · relecture</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
:root { --bg:#f6f3ec; --card:#fffdf8; --fg:#1f2a24; --muted:#5d6b63; --accent:#1f7a5a; --line:#ddd5c4; --hl:#fde9a8;
  --body:-apple-system, "Segoe UI", system-ui, sans-serif; --ar:"Noto Naskh Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif; color-scheme:light }
@media (prefers-color-scheme: dark) { :root { --bg:#13201a; --card:#1b2a23; --fg:#e8efe9; --muted:#9db0a5; --accent:#6fc79f; --line:#2e4238; --hl:#5a4a16; color-scheme:dark } }
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 var(--body); padding:20px max(14px, env(safe-area-inset-left,0px)) 48px }
.wrap { max-width:1200px; margin:0 auto }
h1 { font-size:clamp(24px,5vw,36px); margin:0 0 4px }
.sub { color:var(--muted); margin:0 0 18px }
.bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:2 }
select, input { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg) }
input[type=search] { flex:1; min-width:180px }
label { display:flex; gap:6px; align-items:center; color:var(--muted); font-size:14px }
.count { color:var(--muted); font-size:14px }
table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line) }
th, td { text-align:left; vertical-align:top; padding:8px 10px; border-bottom:1px solid var(--line) }
th { font-size:13px; color:var(--muted); font-weight:600; position:sticky; top:58px; background:var(--card) }
td.n { color:var(--muted); font-variant-numeric:tabular-nums; width:3em }
.ar { font-family:var(--ar); font-size:20px; direction:rtl; unicode-bidi:isolate; display:block }
.lt { font-family:ui-monospace, Menlo, monospace; font-size:13px; color:var(--muted) }
.ex .ar { font-size:17px }
mark { background:var(--hl); color:inherit; border-radius:3px; padding:0 2px }
.de { font-size:13px; color:var(--muted) }
.flag { display:inline-block; font-size:12px; padding:1px 6px; border-radius:10px; background:var(--hl); margin-top:4px }
@media (max-width:760px) { thead { display:none } tr { display:block; border-bottom:1px solid var(--line); padding:8px 0 } td { display:block; border:0; padding:3px 10px } td.n { width:auto } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Dar ed-Darja · relecture</h1>
  <p class="sub">Toutes les niches du palais darija, salle par salle, pour une relecture par un locuteur algérois. « À vérifier » repère les niches signalées comme douteuses (mot-clé faible, tournure à confirmer, phrase adaptée).</p>
  <div class="bar">
    <select id="room" aria-label="Salle"></select>
    <input id="q" type="search" placeholder="Chercher (français, arabe, arabizi)…" aria-label="Chercher">
    <label><input id="doubt" type="checkbox"> à vérifier seulement</label>
    <span class="count" id="count"></span>
  </div>
  <table>
    <thead><tr><th>N°</th><th>Français</th><th>Darija</th><th>Exemple</th><th>Mot-clé · décryptage</th></tr></thead>
    <tbody id="rows"><tr><td colspan="5">Chargement…</td></tr></tbody>
  </table>
</div>
<script>
"use strict";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mark = (t, m) => { t = esc(t); m = esc(m); return m && t.includes(m) ? t.replace(m, "<mark>" + m + "</mark>") : t; };
const DOUBT = /faible|à confirmer|à vérifier|incertain|doute|adapt|pas sûr/i;
let D = null;
const $ = s => document.querySelector(s);
function render() {
  const ri = +$("#room").value, q = $("#q").value.trim().toLowerCase(), only = $("#doubt").checked;
  const rooms = ri < 0 ? D.rooms.map((r, i) => i) : [ri];
  const out = []; let n = 0;
  for (const i of rooms) for (const [k, x] of D.rooms[i].niches.entries()) {
    if (!x) continue;
    const doubt = DOUBT.test((x.de || "") + " " + (x.fo || ""));
    if (only && !doubt) continue;
    if (q && ![x.fr, x.it, x.lt, x.efr, x.eit, x.elt, x.mc].some(v => String(v || "").toLowerCase().includes(q))) continue;
    if (++n > 1500) continue;
    out.push(`<tr><td class="n">${rooms.length > 1 ? i + "·" : ""}${String(k).padStart(2, "0")}</td>
      <td><b>${esc(x.fr)}</b>${doubt ? '<br><span class="flag">à vérifier</span>' : ""}</td>
      <td><span class="ar">${esc(x.it)}</span><span class="lt">${esc(x.lt)} · ${esc(x.pr)}</span><div class="de">${esc(x.fo)}</div></td>
      <td class="ex">${mark(x.efr, x.efm)}<span class="ar">${mark(x.eit, x.eim)}</span><span class="lt">${esc(x.elt)}</span></td>
      <td><b>${esc(x.mc)}</b><div class="de">${esc(x.sc)}</div><div class="de">${esc(x.de)}</div></td></tr>`);
  }
  $("#rows").innerHTML = out.join("") || `<tr><td colspan="5">Aucune niche.</td></tr>`;
  $("#count").textContent = n + " niche(s)" + (n > 1500 ? " · 1 500 premières affichées" : "");
}
fetch("data3d.json").then(r => r.json()).then(d => {
  D = d;
  $("#room").innerHTML = `<option value="-1">Toutes les salles</option>` + d.rooms.map((r, i) => `<option value="${i}">${i} · ${esc(r.fr)}</option>`).join("");
  $("#room").value = "0";
  ["#room", "#q", "#doubt"].forEach(s => $(s).addEventListener("input", render));
  render();
}).catch(() => { $("#rows").innerHTML = `<tr><td colspan="5">Impossible de charger data3d.json.</td></tr>`; });
</script>
</body>
</html>
